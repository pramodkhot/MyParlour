name: myparlour
description: "MyParlour - beauty parlour management (demo)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  # Used by pdf. image 4.10+/4.11 calls an archive method that pdf 3.12's
  # archive range (<4.1) does not have, so it fails to compile. 4.9.2 works.
  # Revisit when the Flutter SDK allows pdf 3.13.1+ (needs Dart 3.12).
  image: 4.9.2
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  # 2.3.x builds native JNI code with the NDK, which stalls the CI APK build.
  # 2.2.22 is the last plain platform-channel version. See DECISIONS.md.
  path_provider_android: 2.2.22
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-700.ttf
          weight: 700
