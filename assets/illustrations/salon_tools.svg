    <circle cx="66" cy="25" r="1.3"/><circle cx="71" cy="25" r="1.3"/><circle cx="76" cy="25" r="1.3"/>
    <circle cx="66" cy="33" r="1.3"/><circle cx="71" cy="33" r="1.3"/><circle cx="76" cy="33" r="1.3"/>
    <rect x="118" y="52" width="24" height="10" rx="2"/>
    <rect x="186" y="40" width="16" height="20" rx="3"/>
    <circle cx="254.8" cy="44.4" r="2.2"/>
  </g>
</svg>
