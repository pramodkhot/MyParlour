<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Original line drawing: comb, brush, cream jar, pump bottle, scissors -->
  <g fill="none" stroke="#A92750" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Comb -->
    <rect x="14" y="8" width="26" height="12" rx="3"/>
    <path d="M17 20 V72 M21 20 V72 M25 20 V72 M29 20 V72 M33 20 V72 M37 20 V72"/>

    <!-- Round brush -->
    <rect x="60" y="8" width="22" height="34" rx="11"/>
    <rect x="67" y="42" width="8" height="32" rx="4"/>

    <!-- Cream jar -->
    <rect x="106" y="34" width="48" height="10" rx="3"/>
    <path d="M110 44 V68 A6 6 0 0 0 116 74 H144 A6 6 0 0 0 150 68 V44"/>

    <!-- Pump bottle -->
    <path d="M200 6 H186 V12 M190 12 H198 V24 H190 Z"/>
    <path d="M200 6 V10"/>
    <rect x="180" y="24" width="28" height="50" rx="7"/>

    <!-- Scissors -->
    <circle cx="243" cy="62" r="8"/>
    <circle cx="265" cy="62" r="8"/>
    <path d="M247 55 L280 10 M261 55 L236 12"/>
  </g>
  <g fill="#D75D85" stroke="none">
    <!-- Rose details: brush bristle dots, jar label, bottle label, pivot -->
