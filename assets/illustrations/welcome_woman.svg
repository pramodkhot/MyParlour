    <path d="M86 101 C89 104 95 104 99 100"/>
    <path d="M89 103.5 L87.5 107 M93 104.2 L92.6 108 M97 102.5 L97.6 106.4"/>
    <path d="M86 92 C90 89 96 89 100 91"/>
