    <path d="M104 58 C92 64 84 76 84 90 C84 95 82 98 79 102 C76 107 72 112 70 116 C69 118 70 120 74 120 C76 120 77 122 76 124 C74 126 73 127 75 129 C77 130 77 131 75 132 C73 134 74 137 77 138 C77 141 76 144 77 147 C78 153 84 157 92 156 C99 155 105 151 110 146"/>
